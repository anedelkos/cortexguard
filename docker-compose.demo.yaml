services:
  edge:
    build:
      context: .
      dockerfile: docker/edge.Dockerfile
      args:
        SLIM: "true"
    ports:
      - "8080:8080"
    environment:
      LOG_LEVEL: INFO
      CLOUD_API_URL: http://cloud-api:8001
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    depends_on:
      - tempo
      - cloud-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz/live"]
      interval: 3s
      timeout: 5s
      retries: 10

  simulator:
    build:
      context: .
      dockerfile: docker/simulator.Dockerfile
      args:
        SLIM: "true"
    environment:
      PYTHONPATH: /workspace/cortexguard/src
    entrypoint: ["python"]
    command: >
      demo/chaos_stream.py
        --scenario ${SCENARIO:-S1.1}
        --endpoint http://edge:8080/api/v1/ingest
        --rate ${RATE:-1.0}
        --repeat 0
    depends_on:
      edge:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.2
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/cortexguard-edge.json"
    volumes:
      - grafana_demo_data:/var/lib/grafana
      - ./docker/grafana_datasources.yaml:/etc/grafana/provisioning/datasources/cortexguard.yaml:ro
      - ./docker/grafana_dashboards.yaml:/etc/grafana/provisioning/dashboards/cortexguard-dashboards.yaml:ro
      - ./docker/grafana_dashboard.json:/var/lib/grafana/dashboards/cortexguard-edge.json:ro

  tempo:
    image: grafana/tempo:latest
    volumes:
      - ./docker/tempo.yaml:/etc/tempo.yaml:ro
    command: ["--config.file=/etc/tempo.yaml"]
    ports:
      - "4318:4318"
      - "3100:3100"

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_demo_data:/qdrant/storage

  cloud-api:
    build:
      context: .
      dockerfile: docker/cloud.Dockerfile
    ports:
      - "8001:8001"
    environment:
      CLOUD_LLM_BACKEND: groq
      CLOUD_GROQ_API_KEY: ${CLOUD_GROQ_API_KEY}
      CLOUD_EMBEDDER_BACKEND: miniLM
      CLOUD_VECTOR_STORE_BACKEND: qdrant
      CLOUD_INCIDENT_STORE: sqlite
      CLOUD_DB_PATH: /data/cortexguard_cloud.db
      CLOUD_QDRANT_URL: http://qdrant:6333
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      LOG_JSON: "true"
    volumes:
      - cloud_demo_db:/data
    depends_on:
      - qdrant
      - tempo

  loki:
    image: grafana/loki:latest
    volumes:
      - ./docker/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_demo_data:/loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - "3101:3100"

  promtail:
    image: grafana/promtail:latest
    volumes:
      - ./docker/promtail-demo.yaml:/etc/promtail/promtail.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["-config.file=/etc/promtail/promtail.yaml"]
    depends_on:
      - loki

volumes:
  grafana_demo_data:
  qdrant_demo_data:
  cloud_demo_db:
  loki_demo_data:
